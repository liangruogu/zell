[package]
name = "zell"
version = "0.1.0"
description = "Zell - Creative Design & Knowledge Management"
authors = ["Zell Team"]
license = "MIT"
repository = "https://github.com/anomalyco/zell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-mcp-bridge = "0.12"
tauri-plugin-playwright = { version = "0.4", optional = true }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
scraper = "0.21"
html-to-markdown-rs = "3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
aes-gcm = "0.10"
base64 = "0.22"
pdf_oxide = "0.3"
opener = "0.7"
undoc = "0.5"

[features]
e2e-testing = ["tauri-plugin-playwright"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
