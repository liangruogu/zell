[package]
name = "bindle"
version = "0.1.0"
description = "Bindle - Project Context & Knowledge Management"
authors = ["Bindle Team"]
license = "MIT"
repository = "https://github.com/anomalyco/bindle"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
aes-gcm = "0.10"
base64 = "0.22"
pdf-extract = "0.7"
opener = "0.7"
